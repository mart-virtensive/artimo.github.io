<section lang="et">
  <h1>Artimo privaatsusteave</h1>
  <p class="m">Kehtib alates 17. november 2026. Rakenduse väljaandja ja vastutav töötleja on OÜ Virtensive (reg. kood 17468380) .</p>

  <h2>Lühidalt</h2>
  <p>Sinu päevik on ainult sinu telefonis. Artimol ei ole kasutajakontot, reklaami, analüütikat ega jälgimist. Telefonist lahkuvad andmed ainult siis, kui kasutad toidufoto analüüsi või ostad midagi. Toidufoto saadetakse analüüsiks ainult sinu nõusolekul ja seda ei salvestata.</p>

  <h2>Mida rakendus sinu telefonis talletab</h2>
  <ul>
    <li>Sinu sissekanded: valu, jäikus, väsimus, märgitud liigesed, ägenemised, võimalikud mõjutajad, hommikune jäikus ja see, mis aitas.</li>
    <li>Artriidi tüüp või tüübid, kui need valid.</li>
    <li>Sinu päevik, kui seda täidad: liikumine, toidumärkmed, toidufotode analüüsi tulemused (toidud, kogused ja toiteväärtus) ning ravimid ja nende kasutamise korrad.</li>
    <li>Sinu harjutuskava, tehtud harjutused ning meeldetuletuste seaded ja kellaajad.</li>
    <li>Keelevalik ja juhuslik rakenduse tunnus (vt allpool).</li>
    <li>Kui ühendad kella või sõrmuse: päevased kokkuvõtted sammudest, unest, puhkepulsist, pulsi varieeruvusest ja trenni kestusest.</li>
  </ul>
  <p>Need andmed on ainult sinu telefonis, rakenduse enda kaustas. Virtensive ei näe neid. Kui telefoni varundamine (iCloud või Google) on sisse lülitatud, võib telefoni varukoopia sisaldada sinu Artimo päevikut. Seda varukoopiat haldad sina oma Apple’i või Google’i kontol. Kellast ja sõrmusest loetud andmeid pilvevarukoopiasse ei panda. Toidufotosid Artimo telefoni ei salvesta; kui pildistad galeriist valitud pilti, jääb see galeriisse nagu varemgi.</p>

  <h2>Toidufoto analüüs</h2>
  <p>Toidufoto analüüs on Premium-funktsioon. Igaüks saab proovida kolme pilti tasuta. Enne esimest pilti küsib Artimo sinu nõusolekut.</p>
  <ul>
    <li><b>Mis saadetakse:</b> toidu pilt, mis on enne saatmist vähendatud ja millest on eemaldatud asukoht ning muu lisateave (EXIF), ja sinu rakenduse tunnus.</li>
    <li><b>Kuhu:</b> Virtensive server Google Cloudis Euroopa Liidus. Server saadab pildi Google’i tehisintellekti mudelile Gemini (Vertex AI), mis töötab samuti Euroopa Liidus.</li>
    <li><b>Mis tagasi tuleb:</b> pildil olevate toitude nimekiri ja kogused. Toiteväärtuse arvutab sinu telefon Tervise Arengu Instituudi andmebaasi NutriData põhjal. Tulemus salvestatakse ainult sinu telefoni.</li>
    <li><b>Säilitamine:</b> Virtensive pilti ei salvesta. See on serveri mälus ainult analüüsi ajal. Google ei kasuta pilte oma mudelite treenimiseks ja Artimo jaoks on Google’i vahemälu välja lülitatud. Google’i tingimuste järgi võib Google teenuse kuritarvitamise avastamiseks päringuid piiratud aja säilitada. [Kontrolli enne avaldamist: kas Virtensive on saanud sellest erandi; kui jah, kustuta see lause.]</li>
    <li><b>Õiguslik alus:</b> sinu selgesõnaline nõusolek (isikuandmete kaitse üldmääruse art 6 lg 1 p a ja art 9 lg 2 p a), sest terviserakenduses tehtud toidupildid võivad kaudselt kirjeldada sinu tervist.</li>
    <li><b>Nõusoleku tagasivõtmine:</b> Seaded → Toidufoto analüüs. Pärast seda ei saadeta ühtegi pilti. See ei mõjuta juba tehtud analüüside seaduslikkust.</li>
  </ul>
  <p>Pildista ainult toitu. Kui pildile jääb kogemata inimene või dokument, töödeldakse ka seda pilti ülal kirjeldatud viisil ja seda ei salvestata.</p>
  <p>Tulemus on tehisintellekti hinnang ja võib olla ebatäpne. Kontrolli seda enne salvestamist.</p>

  <h2>Rakenduse tunnus ja pildiloendurid</h2>
  <p>Selleks, et tasuta pilte ja päevapiiri (20 pilti) lugeda ning Premiumi kontrollida, loob Artimo sinu telefonis juhusliku tunnuse. See ei sisalda sinu nime, e-posti ega telefoninumbrit. Virtensive serveris hoitakse selle tunnuse juures ainult: mitu tasuta pilti on kasutatud, mitu pilti on täna analüüsitud, kas Premium on aktiivne ja millal rakendust viimati kasutati. Õiguslik alus on teenuse osutamine (art 6 lg 1 p b). Kirje kustutatakse 12 kuud pärast viimast kasutust või kohe, kui vajutad Seadetes „Kustuta minu andmed“. Tunnuse näed menüüs Seaded.</p>
  <p>Serveri tehnilised logid (aeg, vastuse tulemus, viga) säilivad 30 päeva ja neis ei ole pilte ega IP-aadresse. Õiguslik alus on õigustatud huvi hoida teenus turvalisena (art 6 lg 1 p f).</p>

  <h2>Premium-tellimus ja toetusmaksed</h2>
  <p>Premium (5 € kuus) ja Artimo toetamine ühekordse maksega käivad läbi App Store’i või Google Play. Makset ja sinu makseandmeid töötleb Apple või Google oma tingimuste järgi; Virtensive sinu nime ega kaardiandmeid ei saa. Ostude kontrollimiseks kasutame teenust RevenueCat, mis saab poest ostu andmed (toode, kuupäevad, hind, riik, poe tehingu tunnus) koos sinu rakenduse tunnusega. Artimo pöördub RevenueCati poole ainult siis, kui avad Premiumi, Artimo toetamise või ostude taastamise või kui sul on Premium. Õiguslik alus on teenuse osutamine (art 6 lg 1 p b) ja raamatupidamise nõuded (art 6 lg 1 p c).</p>

  <h2>Kes andmeid Virtensive nimel töötlevad</h2>
  <table>
    <tr><th>Töötleja</th><th>Milleks</th><th>Kus</th></tr>
    <tr><td>Google Cloud EMEA Limited</td><td>Server, toidufoto analüüs (Gemini), loendurid</td><td>Euroopa Liit</td></tr>
    <tr><td>RevenueCat, Inc.</td><td>Ostude ja tellimuse kontroll</td><td>USA [kontrolli: EL–USA andmeraamistik või lepingu tüüptingimused]</td></tr>
  </table>
  <p>Apple ja Google on maksete puhul iseseisvad vastutavad töötlejad oma privaatsustingimuste järgi.</p>

  <h2>Kella ja sõrmuse andmed</h2>
  <p>Kui annad loa, loeb Artimo Apple Healthist (iPhone) või Health Connectist (Android) samme, und, puhkepulssi, pulsi varieeruvust ja trenne. Artimo ainult loeb neid andmeid ega kirjuta sinna midagi. Neid näidatakse sulle sinu ägenemiste kõrval ja lisatakse raportisse, mille sa ise koostad. Neid andmeid ei saadeta serverisse ega toidufoto analüüsiks, neid ei kasutata reklaamiks, ei müüda ega jagata kellegagi. Loa saad tagasi võtta telefoni seadetes või Artimos menüüs „Kell ja sõrmus“.</p>

  <h2>Jagamine</h2>
  <p>Raport või varukoopia fail liigub edasi ainult siis, kui sa ise vajutad jagamise nuppu ja valid, kuhu see läheb. Need failid sisaldavad ka toidupäevikut ja kella ning sõrmuse kokkuvõtteid.</p>

  <h2>Märguanded</h2>
  <p>Meeldetuletused on telefoni enda märguanded. Need ajastatakse telefonis ja selleks ei kasutata serverit.</p>

  <h2>Seadmed</h2>
  <p>Seadmete vaates on lingid müüjate lehtedele, kus kehtivad müüja tingimused. Artimo ei anna müüjale sinu kohta andmeid ega saa müüjatelt tasu.</p>

  <h2>Sinu õigused</h2>
  <p>Sul on õigus oma andmetega tutvuda, neid parandada ja kustutada, piirata nende töötlemist, esitada vastuväide ja saada oma andmed kaasa. Telefonis olevaid andmeid haldad ise: „Salvesta varukoopia“ annab need failina ja „Kustuta minu andmed“ kustutab need telefonist ja serverist. Serveris olevate andmete kohta kirjuta meile ja lisa oma rakenduse tunnus, sest muul moel me sind ära tunda ei saa. Kui leiad, et sinu õigusi on rikutud, võid pöörduda Andmekaitse Inspektsiooni poole (www.aki.ee).</p>

  <h2>Toiteväärtuse andmed</h2>
  <p>Toiteväärtused pärinevad Tervise Arengu Instituudi toidu koostise andmebaasist NutriData (tka.nutridata.ee). Toidu vaste ja koguse leiab tehisintellekt. Tervise Arengu Instituut ei vastuta Artimo arvutatud tulemuste eest.</p>

  <h2>Lapsed</h2>
  <p>Artimo on mõeldud täiskasvanutele (18+).</p>

  <h2>Ei ole meditsiiniseade</h2>
  <p>Artimo on päevik ja abimees. See ei pane diagnoosi, ei ennusta ägenemisi, ei anna toitumis- ega raviplaani ega asenda arsti või toitumisnõustaja nõu.</p>

  <h2>Muudatused ja kontakt</h2>
  <p>Kui see tekst muutub, näitab rakendus seda enne, kui järgmine pilt saadetakse. Küsimused: Virtensive, <span data-fill="contact">mart@virtensive.com</span>.</p>
</section>

<section lang="en">
  <h1>Artimo privacy information</h1>
  <p class="m">Effective from 17th November 2026. The app is published by OU Virtensive (reg. code 17468380 in Estonian business registry), which is the data controller.</p>

  <h2>In short</h2>
  <p>Your diary is only on your phone. Artimo has no user account, no advertising, no analytics and no tracking. Data leaves the phone only when you use food photo analysis or buy something. A food photo is sent for analysis only with your consent, and it is not kept.</p>

  <h2>What the app stores on your phone</h2>
  <ul>
    <li>Your check-ins: pain, stiffness, fatigue, marked joints, flares, possible triggers, morning stiffness and what helped.</li>
    <li>Your arthritis type or types, if you choose them.</li>
    <li>Your diary, if you keep it: movement, food notes, food photo results (foods, amounts and nutrition values), and your medication with how often you used it.</li>
    <li>Your exercise plan, completed exercises, and your reminder settings and times.</li>
    <li>Your language choice and a random app ID (see below).</li>
    <li>If you connect a watch or ring: daily summaries of steps, sleep, resting heart rate, heart rate variability and workout duration.</li>
  </ul>
  <p>This data is only on your phone, in the app’s own folder. Virtensive cannot see it. If phone backup (iCloud or Google) is switched on, your phone’s backup may include your Artimo diary. You control that backup in your Apple or Google account. Data read from a watch or ring is kept out of the cloud backup. Artimo does not save food photos on the phone; if you pick a photo from your gallery, it stays in the gallery as before.</p>

  <h2>Food photo analysis</h2>
  <p>Food photo analysis is a Premium feature. Everyone can try three photos free. Artimo asks for your consent before the first photo.</p>
  <ul>
    <li><b>What is sent:</b> the photo of your food, made smaller and with its location and other details (EXIF) removed, and your app ID.</li>
    <li><b>Where:</b> Virtensive’s server on Google Cloud in the European Union. The server passes the photo to Google’s AI model Gemini (Vertex AI), which also runs in the European Union.</li>
    <li><b>What comes back:</b> a list of the foods in the photo and their amounts. Your phone calculates the nutrition values from NutriData, the database of the National Institute for Health Development. The result is saved only on your phone.</li>
    <li><b>Keeping:</b> Virtensive does not keep the photo. It is in the server’s memory only during the analysis. Google does not use the photos to train its models, and Google’s caching is switched off for Artimo. Under Google’s terms, Google may keep requests for a limited time to detect abuse of the service. [Check before publishing: whether Virtensive has an exception from this; if so, delete this sentence.]</li>
    <li><b>Legal basis:</b> your explicit consent (GDPR Article 6(1)(a) and Article 9(2)(a)), because food photos taken in a health app can indirectly say something about your health.</li>
    <li><b>Withdrawing consent:</b> Settings → Food photo analysis. After that no photo is sent. This does not affect analyses already done.</li>
  </ul>
  <p>Photograph only food. If a person or a document ends up in a photo by accident, that photo is processed in the same way and is not kept.</p>
  <p>The result is an AI estimate and may be wrong. Check it before saving.</p>

  <h2>App ID and photo counters</h2>
  <p>To count free photos and the daily limit (20 photos) and to check Premium, Artimo creates a random ID on your phone. It contains no name, email or phone number. Virtensive’s server keeps only this with the ID: how many free photos have been used, how many photos were analysed today, whether Premium is active, and when the app was last used. The legal basis is providing the service (Article 6(1)(b)). The record is deleted 12 months after last use, or straight away when you press “Delete my data” in Settings. You can see the ID in Settings.</p>
  <p>The server’s technical logs (time, result, error) are kept for 30 days and contain no photos and no IP addresses. The legal basis is the legitimate interest in keeping the service secure (Article 6(1)(f)).</p>

  <h2>Premium subscription and support payments</h2>
  <p>Premium (€5 a month) and one-off support payments go through the App Store or Google Play. Apple or Google processes the payment and your payment details under their own terms; Virtensive does not receive your name or card details. To check purchases we use RevenueCat, which receives the purchase details from the store (product, dates, price, country, store transaction ID) together with your app ID. Artimo contacts RevenueCat only when you open Premium, Support Artimo or Restore purchases, or when you have Premium. The legal basis is providing the service (Article 6(1)(b)) and accounting obligations (Article 6(1)(c)).</p>

  <h2>Who processes data for Virtensive</h2>
  <table>
    <tr><th>Processor</th><th>What for</th><th>Where</th></tr>
    <tr><td>Google Cloud EMEA Limited</td><td>Server, food photo analysis (Gemini), counters</td><td>European Union</td></tr>
    <tr><td>RevenueCat, Inc.</td><td>Checking purchases and the subscription</td><td>USA [check: EU–US Data Privacy Framework or standard contractual clauses]</td></tr>
  </table>
  <p>For payments, Apple and Google are independent controllers under their own privacy terms.</p>

  <h2>Watch and ring data</h2>
  <p>If you give permission, Artimo reads steps, sleep, resting heart rate, heart rate variability and workouts from Apple Health (iPhone) or Health Connect (Android). Artimo only reads this data and writes nothing back. It is shown to you next to your flares and included in a report you create yourself. It is never sent to the server or used for food photo analysis, never used for advertising, never sold and never shared. You can withdraw permission in the phone settings or in Artimo under “Watch and ring”.</p>

  <h2>Sharing</h2>
  <p>A report or a backup file leaves the phone only when you press the share button and choose where it goes. These files include the food diary and the watch and ring summaries.</p>

  <h2>Notifications</h2>
  <p>Reminders are notifications from the phone itself. They are scheduled on the phone and no server is involved.</p>

  <h2>Supporting devices</h2>
  <p>The Devices view links to sellers’ pages, where the seller’s own terms apply. Artimo passes no data about you to sellers and takes no payment from them.</p>

  <h2>Your rights</h2>
  <p>You have the right to access, correct and delete your data, to restrict its processing, to object, and to take your data with you. You manage the data on your phone yourself: “Save a backup” gives it to you as a file, and “Delete my data” deletes it from the phone and the server. For data on the server, write to us and include your app ID, because we have no other way to recognise you. If you believe your rights have been infringed, you can contact the Estonian Data Protection Inspectorate (www.aki.ee).</p>

  <h2>Nutrition data</h2>
  <p>Nutrition values come from NutriData, the food composition database of the National Institute for Health Development (tka.nutridata.ee). The matching food and the amount are found by AI. The Institute is not responsible for the results Artimo calculates.</p>

  <h2>Children</h2>
  <p>Artimo is intended for adults (18+).</p>

  <h2>Not a medical device</h2>
  <p>Artimo is a diary and a helper. It does not diagnose, does not predict flares, gives no diet or treatment plan, and does not replace advice from your doctor or a dietitian.</p>

  <h2>Changes and contact</h2>
  <p>If this text changes, the app shows it before the next photo is sent. Questions: Virtensive, <span data-fill="contact">mart@virtensive.com</span>.</p>
</section>
